<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Top Links</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --bg: #ffffff;
            --text: #222222;
            --heading: #080073;
            --card: rgba(255, 255, 255, 0.48);
            --card-inner: rgba(255, 255, 255, 0.55);
            --border: rgba(255, 255, 255, 0.85);
            --footer: #666666;
            --button-shadow: rgba(33, 45, 126, 0.3);
            --glow-opacity: 0.25;
        }

        :root[data-theme="dark"] {
            --bg: #070b16;
            --text: #ffffff;
            --heading: #ffffff;
            --card: rgba(8, 14, 30, 0.58);
            --card-inner: rgba(8, 14, 30, 0.78);
            --border: rgba(255, 255, 255, 0.12);
            --footer: #aaaaaa;
            --button-shadow: rgba(0, 0, 0, 0.5);
            --glow-opacity: 0.15;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(79, 150, 236, var(--glow-opacity)),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(113, 72, 255, var(--glow-opacity)),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            transition:
                background 0.6s ease,
                color 0.6s ease;
        }

        /* Background Glow */

        .glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
            z-index: -3;
        }

        .glow-one {
            top: -220px;
            left: -180px;
            background: #4f96ec;
            animation: glowOne 12s ease-in-out infinite alternate;
        }

        .glow-two {
            right: -220px;
            bottom: -220px;
            background: #7148ff;
            animation: glowTwo 15s ease-in-out infinite alternate;
        }

        @keyframes glowOne {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(180px, 130px) scale(1.25);
            }

            100% {
                transform: translate(60px, 280px) scale(0.9);
            }
        }

        @keyframes glowTwo {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-150px, -120px) scale(1.3);
            }

            100% {
                transform: translate(-50px, -250px) scale(0.9);
            }
        }

        /* Floating Particles */

        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .particles span {
            position: absolute;
            bottom: -20px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4f96ec;
            opacity: 0;
            animation: particleFloat linear infinite;
        }

        .particles span:nth-child(1) {
            left: 5%;
            animation-duration: 12s;
        }

        .particles span:nth-child(2) {
            left: 15%;
            animation-duration: 17s;
            animation-delay: 2s;
        }

        .particles span:nth-child(3) {
            left: 25%;
            animation-duration: 14s;
            animation-delay: 4s;
        }

        .particles span:nth-child(4) {
            left: 35%;
            animation-duration: 19s;
            animation-delay: 1s;
        }

        .particles span:nth-child(5) {
            left: 45%;
            animation-duration: 13s;
            animation-delay: 5s;
        }

        .particles span:nth-child(6) {
            left: 55%;
            animation-duration: 16s;
            animation-delay: 3s;
        }

        .particles span:nth-child(7) {
            left: 65%;
            animation-duration: 20s;
            animation-delay: 6s;
        }

        .particles span:nth-child(8) {
            left: 75%;
            animation-duration: 15s;
            animation-delay: 2s;
        }

        .particles span:nth-child(9) {
            left: 85%;
            animation-duration: 18s;
            animation-delay: 4s;
        }

        .particles span:nth-child(10) {
            left: 95%;
            animation-duration: 13s;
            animation-delay: 7s;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }

            15% {
                opacity: 0.5;
            }

            70% {
                opacity: 0.35;
            }

            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }

        /* Theme Button */

        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 52px;
            height: 52px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--heading);
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease,
                background 0.4s ease;
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.15);
            box-shadow:
                0 0 15px rgba(79, 150, 236, 0.5),
                0 0 35px rgba(79, 150, 236, 0.25);
        }

        .theme-toggle:active {
            transform: scale(0.85);
        }

        /* Main */

        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px;
            animation: pageEnter 1s ease forwards;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Heading */

        h1 {
            position: relative;
            margin-bottom: 40px;
            font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
            font-size: clamp(40px, 7vw, 60px);
            font-weight: 600;
            color: var(--heading);
            text-align: center;
            letter-spacing: 2px;
            transition:
                color 0.5s ease,
                transform 0.4s ease,
                text-shadow 0.4s ease;
            animation: titleReveal 1.1s ease;
        }

        h1::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            margin: 12px auto 0;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                #4f96ec,
                #212d7e,
                #8b5cf6
            );
            animation: underlineReveal 1s ease 0.5s both;
        }

        h1:hover {
            transform: scale(1.05);
            text-shadow:
                0 0 10px rgba(79, 150, 236, 0.35),
                0 0 30px rgba(79, 150, 236, 0.2);
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(-40px) scale(0.8);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes underlineReveal {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 70px;
                opacity: 1;
            }
        }

        /* Card */

        .links-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 26px;
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.7);
            transition:
                background 0.6s ease,
                border 0.6s ease,
                box-shadow 0.6s ease,
                transform 0.25s ease;
            animation: cardReveal 1s ease 0.3s both;
            isolation: isolate;
        }

        .links-container::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 28px;
            background: linear-gradient(
                90deg,
                #4f96ec,
                #212d7e,
                #8b5cf6,
                #4f96ec
            );
            background-size: 300% 300%;
            animation: borderGlow 5s ease infinite;
            z-index: -2;
            opacity: 0.75;
            filter: blur(1px);
        }

        .links-container::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 25px;
            background: var(--card-inner);
            z-index: -1;
            transition: background 0.6s ease;
        }

        @keyframes borderGlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* Links */

        .link-item {
            width: 100%;
            max-width: 420px;
            margin: 13px auto;
            opacity: 0;
            animation: linkReveal 0.8s ease forwards;
        }

        .link-item:nth-child(1) {
            animation-delay: 0.7s;
        }

        .link-item:nth-child(2) {
            animation-delay: 0.9s;
        }

        .link-item:nth-child(3) {
            animation-delay: 1.1s;
        }

        @keyframes linkReveal {
            from {
                opacity: 0;
                transform: translateX(-45px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .link-button {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 58px;
            padding: 15px 50px 15px 20px;
            border-radius: 35px;
            background: linear-gradient(
                110deg,
                #4f96ec,
                #212d7e,
                #7148ff,
                #4f96ec
            );
            background-size: 300% 100%;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 20px var(--button-shadow);
            transition:
                transform 0.35s cubic-bezier(.2, .8, .2, 1),
                box-shadow 0.35s ease,
                background-position 0.6s ease;
        }

        .link-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.45),
                transparent
            );
            transform: skewX(-25deg);
            transition: left 0.65s ease;
        }

        .link-button:hover::before {
            left: 130%;
        }

        .link-button:hover {
            transform: translateY(-6px) scale(1.035);
            background-position: 100% 0;
            box-shadow:
                0 15px 35px rgba(33, 45, 126, 0.4),
                0 0 25px rgba(79, 150, 236, 0.35);
        }

        .link-button:active {
            transform: scale(0.96);
        }

        /* Icons */

        .link-icon {
            width: 30px;
            height: 30px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            transition:
                transform 0.5s ease,
                filter 0.4s ease;
        }

        .link-logo {
            width: 30px;
            height: 30px;
            margin-right: 15px;
            object-fit: contain;
            transition:
                transform 0.5s ease,
                filter 0.4s ease;
        }

        .link-button:hover .link-logo,
        .link-button:hover .link-icon {
            transform: rotate(360deg) scale(1.2);
            filter: drop-shadow(
                0 0 5px rgba(255, 255, 255, 0.9)
            );
        }

        .arrow {
            position: absolute;
            right: 20px;
            font-size: 22px;
            opacity: 0.7;
            transition:
                transform 0.35s ease,
                opacity 0.35s ease;
        }

        .link-button:hover .arrow {
            transform: translate(4px, -4px);
            opacity: 1;
        }

        /* Footer */

        .footer-text {
            margin-top: 28px;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--footer);
            opacity: 0;
            animation: footerReveal 1s ease 1.4s forwards;
            transition: color 0.5s ease;
        }

        @keyframes footerReveal {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 0.75;
                transform: translateY(0);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {
            .theme-toggle {
                top: 15px;
                right: 15px;
                width: 46px;
                height: 46px;
            }

            .main-container {
                padding: 75px 15px 30px;
            }

            h1 {
                font-size: 42px;
                margin-bottom: 30px;
            }

            .links-container {
                padding: 25px 15px;
                border-radius: 22px;
            }

            .link-button {
                min-height: 54px;
                font-size: 16px;
                padding: 14px 45px 14px 15px;
            }

            .link-logo,
            .link-icon {
                width: 27px;
                height: 27px;
                margin-right: 12px;
            }

            .arrow {
                right: 16px;
            }
        }

        /* Reduced Motion */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Background Effects -->

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- Theme Button -->

    <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
    >
        🌙
    </button>

    <!-- Main Content -->

    <main class="main-container">

        <h1>My Top Links</h1>

        <div class="links-container">

            <!-- Portfolio -->

            <div class="link-item">

                <a
                    class="link-button"
                    href="https://ajay-s-portfolio-six.vercel.app/Home/home.html"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span class="link-icon">💻</span>

                    <span>Portfolio Website</span>

                    <span class="arrow">↗</span>

                </a>

            </div>

            <!-- GitHub -->

            <div class="link-item">

                <a
                    class="link-button"
                    href="https://github.com/ajayxuns"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <img
                        class="link-logo"
                        src="https://cdn-icons-png.flaticon.com/512/25/25231.png"
                        alt="GitHub Logo"
                    >

                    <span>GitHub Profile</span>

                    <span class="arrow">↗</span>

                </a>

            </div>

            <!-- LinkedIn -->

            <div class="link-item">

                <a
                    class="link-button"
                    href="https://www.linkedin.com/in/ajaybankar/"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <img
                        class="link-logo"
                        src="https://cdn-icons-png.flaticon.com/512/174/174857.png"
                        alt="LinkedIn Logo"
                    >

                    <span>LinkedIn Profile</span>

                    <span class="arrow">↗</span>

                </a>

            </div>

        </div>

        <p class="footer-text">
            Connect • Explore • Build
        </p>

    </main>

    <script>
        const root = document.documentElement;
        const themeToggle = document.getElementById("theme-toggle");

        function setTheme(theme) {
            root.setAttribute("data-theme", theme);

            if (theme === "dark") {
                themeToggle.textContent = "☀️";
                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to light mode"
                );
            } else {
                themeToggle.textContent = "🌙";
                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to dark mode"
                );
            }

            localStorage.setItem("theme", theme);
        }

        /* Automatically load saved theme */

        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark" || savedTheme === "light") {
            setTheme(savedTheme);
        } else {
            /* Automatically detect user's device theme */

            const prefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            setTheme(prefersDark ? "dark" : "light");
        }

        /* Theme button */

        themeToggle.addEventListener("click", function () {

            const currentTheme =
                root.getAttribute("data-theme");

            if (currentTheme === "dark") {
                setTheme("light");
            } else {
                setTheme("dark");
            }

        });

        /* 3D Card Effect */

        const card =
            document.querySelector(".links-container");

        card.addEventListener("mousemove", function (event) {

            const rect = card.getBoundingClientRect();

            const x =
                event.clientX - rect.left;

            const y =
                event.clientY - rect.top;

            const centerX =
                rect.width / 2;

            const centerY =
                rect.height / 2;

            const rotateX =
                ((y - centerY) / centerY) * -3;

            const rotateY =
                ((x - centerX) / centerX) * 3;

            card.style.transform =
                `perspective(1000px)
                 rotateX(${rotateX}deg)
                 rotateY(${rotateY}deg)
                 translateY(-8px)`;
        });

        card.addEventListener("mouseleave", function () {

            card.style.transform =
                "perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)";

        });
    </script>

</body>
</html>
